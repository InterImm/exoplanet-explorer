# Publish the site to GitHub Pages. The site has no build step: the repository root is the site.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh planet data"]   # its data commit is pushed by GITHUB_TOKEN, which does not trigger `push`
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html favicon.svg .nojekyll app data vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
